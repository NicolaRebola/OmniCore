services:
  catalog-api:
    image: mcr.microsoft.com/dotnet/sdk:9.0-alpine
    working_dir: /app
    volumes:
      - .:/app
      - nuget-cache:/root/.nuget/packages
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_BROWSER_REFRESH: "1"
      DOTNET_GCConserveMemory: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/swagger/v1/swagger.json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: >
      dotnet watch run
        --project src/CatalogService.Api/CatalogService.Api.csproj
        --no-launch-profile

volumes:
  nuget-cache: