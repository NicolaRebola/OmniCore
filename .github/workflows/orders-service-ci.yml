name: orders-service-ci

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "orders-service/**"
      - ".github/workflows/orders-service-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "orders-service/**"
      - ".github/workflows/orders-service-ci.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build and test (orders-service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: orders-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: orders-service/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -v

      - name: Vet
        run: go vet ./...
