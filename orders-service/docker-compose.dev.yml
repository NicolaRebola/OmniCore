services:
  orders-api:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://omnicore:omnicore@postgres:5432/orders?sslmode=disable
      CATALOG_BASE_URL: http://catalog-api:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: go run ./cmd/api
    networks:
      - omnicore-dev

networks:
  omnicore-dev:
    external: true
    name: omnicore-dev

volumes:
  go-mod-cache: